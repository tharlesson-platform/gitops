name: Release Docs Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "policies/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "GOVERNANCE.md"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null

jobs:
  docs-quality:
    runs-on: ["gitops-run-${{ github.run_id }}"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and isolated guest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /opt/isolation-base-ready
          test ! -L /opt/isolation-base-ready
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -z "${SSH_AUTH_SOCK:-}"
          test -z "${LOCAL_ARTIFACT_TOKEN:-}"
          test -z "${LOCAL_ARTIFACT_URL:-}"
          for credential in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_PROFILE AWS_DEFAULT_PROFILE; do
            test -z "${!credential:-}"
          done
          mount_inventory=$(findmnt --raw --noheadings --output FSTYPE)
          test -n "$mount_inventory"
          while IFS= read -r filesystem; do
            case "$filesystem" in
              9p|virtiofs|nfs|nfs4|cifs|smbfs|fuse.sshfs|""|*[!A-Za-z0-9_.-]*) exit 1 ;;
            esac
          done <<< "$mount_inventory"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install markdownlint
        shell: bash
        run: |
          set -euo pipefail
          tool_directory=$(mktemp -d "$RUNNER_TEMP/gitops-markdownlint.XXXXXXXX")
          npm install --prefix "$tool_directory" --no-save markdownlint-cli
          printf '%s\n' "$tool_directory/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Lint markdown
        run: markdownlint "**/*.md" --ignore node_modules

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress README.md docs/**/*.md policies/**/*.md CONTRIBUTING.md SECURITY.md GOVERNANCE.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Docs Quality"
            echo ""
            echo "- Markdown lint: enabled"
            echo "- Link check: enabled"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
