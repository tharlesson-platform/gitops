name: Security Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    runs-on: ["gitops-run-${{ github.run_id }}"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and isolated guest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /opt/isolation-base-ready
          test ! -L /opt/isolation-base-ready
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -z "${SSH_AUTH_SOCK:-}"
          test -z "${LOCAL_ARTIFACT_TOKEN:-}"
          test -z "${LOCAL_ARTIFACT_URL:-}"
          for credential in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_PROFILE AWS_DEFAULT_PROFILE; do
            test -z "${!credential:-}"
          done
          mount_inventory=$(findmnt --raw --noheadings --output FSTYPE)
          test -n "$mount_inventory"
          while IFS= read -r filesystem; do
            case "$filesystem" in
              9p|virtiofs|nfs|nfs4|cifs|smbfs|fuse.sshfs|""|*[!A-Za-z0-9_.-]*) exit 1 ;;
            esac
          done <<< "$mount_inventory"

      - name: Install verified gitleaks for Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          tool_directory=$(mktemp -d "$RUNNER_TEMP/gitops-gitleaks.XXXXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 180 \
            --output "$tool_directory/tool.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz
          printf '%s  %s\n' 'e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080' "$tool_directory/tool.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_directory/tool.tar.gz" -C "$tool_directory" gitleaks
          chmod 0755 "$tool_directory/gitleaks"
          test "$GITLEAKS_VERSION" = 8.30.1
          test "$("$tool_directory/gitleaks" version)" = 8.30.1
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"

      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --no-banner --redact --exit-code 1

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Secret Scan"
            echo ""
            echo "- Tool: gitleaks"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  critical-path-guard:
    if: github.event_name == 'pull_request'
    runs-on: ["gitops-run-${{ github.run_id }}"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and isolated guest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /opt/isolation-base-ready
          test ! -L /opt/isolation-base-ready
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -z "${SSH_AUTH_SOCK:-}"
          test -z "${LOCAL_ARTIFACT_TOKEN:-}"
          test -z "${LOCAL_ARTIFACT_URL:-}"
          for credential in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_PROFILE AWS_DEFAULT_PROFILE; do
            test -z "${!credential:-}"
          done
          mount_inventory=$(findmnt --raw --noheadings --output FSTYPE)
          test -n "$mount_inventory"
          while IFS= read -r filesystem; do
            case "$filesystem" in
              9p|virtiofs|nfs|nfs4|cifs|smbfs|fuse.sshfs|""|*[!A-Za-z0-9_.-]*) exit 1 ;;
            esac
          done <<< "$mount_inventory"

      - name: Detect critical path changes
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-critical-paths.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Enforce production approval label
        id: prod_guard
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

          if echo "$changed_files" | grep -q '^clusters/prod/'; then
            echo "prod_changed=true" >> "$GITHUB_OUTPUT"
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if ! echo "$labels" | grep -qx 'prod-approved'; then
              echo "ERROR: changes in clusters/prod/ require label 'prod-approved'."
              exit 1
            fi
          else
            echo "prod_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Critical Path Guard"
            echo ""
            echo "- Path guard for: .github/workflows/, argocd/, clusters/prod/, policies/"
            echo "- Prod label check: \`prod-approved\`"
            echo "- Production files changed: ${{ steps.prod_guard.outputs.prod_changed || 'false' }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  prod-direct-change-alert:
    if: github.event_name == 'push'
    runs-on: ["gitops-run-${{ github.run_id }}"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and isolated guest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /opt/isolation-base-ready
          test ! -L /opt/isolation-base-ready
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -z "${SSH_AUTH_SOCK:-}"
          test -z "${LOCAL_ARTIFACT_TOKEN:-}"
          test -z "${LOCAL_ARTIFACT_URL:-}"
          for credential in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_PROFILE AWS_DEFAULT_PROFILE; do
            test -z "${!credential:-}"
          done
          mount_inventory=$(findmnt --raw --noheadings --output FSTYPE)
          test -n "$mount_inventory"
          while IFS= read -r filesystem; do
            case "$filesystem" in
              9p|virtiofs|nfs|nfs4|cifs|smbfs|fuse.sshfs|""|*[!A-Za-z0-9_.-]*) exit 1 ;;
            esac
          done <<< "$mount_inventory"

      - name: Alert direct changes in production paths
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          if echo "$changed_files" | grep -q '^clusters/prod/'; then
            echo "::warning::Production paths changed on push to main. Ensure this came from an approved PR."
            echo "prod_push_change=true" >> "$GITHUB_ENV"
          else
            echo "prod_push_change=false" >> "$GITHUB_ENV"
          fi

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Production Push Alert"
            echo ""
            echo "- Trigger: push to main"
            echo "- Production path changed: ${prod_push_change:-false}"
            echo "- Action: warning only (branch protection should block direct pushes)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
