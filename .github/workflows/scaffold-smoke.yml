name: Scaffold Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null

jobs:
  scaffold:
    runs-on: ["gitops-run-${{ github.run_id }}"]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and isolated guest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /opt/isolation-base-ready
          test ! -L /opt/isolation-base-ready
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -z "${SSH_AUTH_SOCK:-}"
          test -z "${LOCAL_ARTIFACT_TOKEN:-}"
          test -z "${LOCAL_ARTIFACT_URL:-}"
          for credential in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_PROFILE AWS_DEFAULT_PROFILE; do
            test -z "${!credential:-}"
          done
          mount_inventory=$(findmnt --raw --noheadings --output FSTYPE)
          test -n "$mount_inventory"
          while IFS= read -r filesystem; do
            case "$filesystem" in
              9p|virtiofs|nfs|nfs4|cifs|smbfs|fuse.sshfs|""|*[!A-Za-z0-9_.-]*) exit 1 ;;
            esac
          done <<< "$mount_inventory"

      - name: Generate sample app
        run: |
          chmod +x scripts/create-app.sh
          ./scripts/create-app.sh \
            --name scaffold-smoke \
            --image ghcr.io/example-org/scaffold-smoke:0.1.0 \
            --port 8080

      - name: Assert generated structure
        run: |
          test -f apps/scaffold-smoke/base/deployment.yaml
          test -f apps/scaffold-smoke/base/service.yaml
          test -f apps/scaffold-smoke/overlays/dev/kustomization.yaml
          test -f apps/scaffold-smoke/overlays/stage/kustomization.yaml
          test -f apps/scaffold-smoke/overlays/prod/kustomization.yaml
